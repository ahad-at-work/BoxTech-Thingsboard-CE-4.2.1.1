<mat-sidenav-container autosize [class.tb-theme-tme]="isTmeCustomer">
  <mat-sidenav #sidenav class="tb-site-sidenav mat-elevation-z2"
               [class.tb-sidebar-collapsed]="sidebarCollapsed"
               [disableClose]="sidenavOpened"
               (click)="sidenavClicked()"
               [mode]="sidenavMode"
               [opened]="sidenavOpened && !forceFullscreen">
    <mat-toolbar color="primary" class="tb-side-menu-toolbar flex flex-1 flex-col" role="navigation">
      <div class="tb-sidebar-scroll-area flex flex-col">
        <div class="tb-sidebar-top-bar" [class.tb-collapsed]="sidebarCollapsed">
          <div class="tb-sidebar-brand" *ngIf="!sidebarCollapsed" [class.tb-sidebar-brand-tme]="isTmeCustomer">
            <img [src]="isTmeCustomer ? 'assets/tme-logo-sidebar.png' : 'assets/boxtech-logo-green-sidebar.png'"
                 [alt]="isTmeCustomer ? 'TME' : 'BoxTech'"
                 [class.tb-sidebar-logo-tme]="isTmeCustomer"
                 class="tb-sidebar-logo"/>
          </div>
          <div class="tb-sidebar-brand-collapsed-tme" *ngIf="sidebarCollapsed && isTmeCustomer">
            <img src="assets/tme-logo-mark.png" alt="TME" class="tb-sidebar-logo-mark-tme"/>
          </div>
          <button mat-icon-button class="tb-sidebar-collapse-toggle" *ngIf="!isMobileSidebar && !isTmeCustomer" (click)="toggleSidebarCollapsed()">
            <svg class="tb-panel-left-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2"/>
              <path d="M9 3v18"/>
            </svg>
          </button>
        </div>
        <tb-side-menu [collapsed]="sidebarCollapsed" [tmeMode]="isTmeCustomer"></tb-side-menu>
      </div>
      <div class="tb-sidebar-account" [class.tb-collapsed]="sidebarCollapsed" (click)="$event.stopPropagation()">
        <tb-user-menu [displayUserInfo]="!sidebarCollapsed"></tb-user-menu>
      </div>
      </mat-toolbar>
  </mat-sidenav>
  <mat-sidenav-content>
    <div class="flex flex-col" role="main" style="height: 100%;">
      <mat-toolbar color="primary" class="tb-primary-toolbar flex flex-row">
        <button mat-icon-button
                *ngIf="isTmeCustomer && !isMobileSidebar"
                class="tb-sidebar-collapse-toggle-tme tb-sidebar-collapse-toggle-tme-header"
                [attr.aria-label]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
                [matTooltip]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
                matTooltipPosition="right"
                (click)="toggleSidebarCollapsed()">
          <mat-icon class="material-icons">{{ sidebarCollapsed ? 'chevron_right' : 'chevron_left' }}</mat-icon>
        </button>
        <button mat-icon-button id="main"
                [class.!hidden]="forceFullscreen || displaySearchMode()"
                class="gt-sm:!hidden" (click)="sidenav.toggle()">
          <mat-icon class="material-icons">menu</mat-icon>
        </button>
        <button mat-icon-button
                [class.!hidden]="!forceFullscreen || displaySearchMode"
                (click)="goBack()">
          <mat-icon class="material-icons">arrow_back</mat-icon>
        </button>
        <button mat-icon-button
                [class.!hidden]="!displaySearchMode()"
                (click)="closeSearch()">
          <mat-icon class="material-icons">arrow_back</mat-icon>
        </button>
        <nav class="tb-topbar-nav flex flex-row" [class.!hidden]="displaySearchMode() || isTmeCustomer">
          <a class="tb-topbar-link" routerLink="/dashboards" routerLinkActive="tb-topbar-link-active">
            <span translate>dashboard.dashboards</span>
          </a>
          <div class="tb-topbar-dropdown">
            <span class="tb-topbar-link">
              <span translate>entity.entities</span>
              <mat-icon class="tb-topbar-caret">expand_more</mat-icon>
            </span>
            <div class="tb-topbar-dropdown-panel tb-entities-dropdown-panel">
              <a *ngFor="let item of entitiesLinks$ | async" class="tb-topbar-dropdown-item" [routerLink]="item.path">
                <span [translate]="item.name"></span>
              </a>
            </div>
          </div>
          <div class="tb-topbar-dropdown">
            <span class="tb-topbar-link">
              <span translate>profiles.profiles</span>
              <mat-icon class="tb-topbar-caret">expand_more</mat-icon>
            </span>
            <div class="tb-topbar-dropdown-panel tb-profiles-dropdown-panel">
              <a *ngFor="let item of profilesLinks$ | async" class="tb-topbar-dropdown-item" [routerLink]="item.path">
                <span [translate]="item.name"></span>
              </a>
            </div>
          </div>
          <a class="tb-topbar-link" routerLink="/customers" routerLinkActive="tb-topbar-link-active">
            <span translate>customer.customers</span>
          </a>
          <div class="tb-topbar-dropdown">
            <span class="tb-topbar-link">
              <span translate>admin.resources</span>
              <mat-icon class="tb-topbar-caret">expand_more</mat-icon>
            </span>
            <div class="tb-topbar-dropdown-panel tb-resources-dropdown-panel">
              <a *ngFor="let item of resourcesLinks$ | async" class="tb-topbar-dropdown-item" [routerLink]="item.path">
                <span [translate]="item.name"></span>
              </a>
            </div>
          </div>
        </nav>
        <div [class.!hidden]="!displaySearchMode()" class="tb-dark flex flex-1 flex-row">
          <mat-form-field class="tb-appearance-transparent flex-1">
            <input #searchInput matInput
                   [formControl]="textSearch"
                   placeholder="{{ 'common.enter-search' | translate }}"/>
          </mat-form-field>
        </div>
        <tb-github-badge class="lt-md:!hidden"></tb-github-badge>
        <div class="tb-topbar-right flex flex-row">
          <button [class.!hidden]="!searchEnabled"
                  mat-icon-button (click)="openSearch()">
            <mat-icon class="material-icons">search</mat-icon>
          </button>
          <div class="tb-header-search" [class.!hidden]="isCustomerUser">
            <mat-icon class="tb-search-icon material-icons">search</mat-icon>
            <input class="tb-search-input"
                   type="text"
                   placeholder="Search pages..."
                   [value]="searchQuery"
                   (input)="onSearchInput($any($event.target).value)"
                   (blur)="closeSidebarSearch()"
                   (click)="$event.stopPropagation()"/>
            <div class="tb-search-results" *ngIf="searchOpen">
              <div class="tb-search-result-item"
                   *ngFor="let result of searchResults"
                   (mousedown)="navigateToResult(result.path)">
                <mat-icon class="material-icons tb-search-result-icon">{{result.icon}}</mat-icon>
                <span translate>{{result.name}}</span>
              </div>
            </div>
          </div>
          <button *ngIf="fullscreenEnabled"
                  [class.!hidden]="displaySearchMode()"
                  class="lt-md:!hidden"
                  mat-icon-button (click)="toggleFullscreen()">
            <mat-icon class="material-icons">{{ isFullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
          </button>
          <tb-notification-bell></tb-notification-bell>
        </div>
      </mat-toolbar>
      <mat-progress-bar color="warn" style="z-index: 10; margin-bottom: -4px; width: 100%;" mode="indeterminate"
                        *ngIf="!hideLoadingBar && (isLoading$ | async)">
      </mat-progress-bar>
      <div tb-toast class="tb-main-content flex flex-1 flex-col">
        <router-outlet (activate)="activeComponentChanged($event)"></router-outlet>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
